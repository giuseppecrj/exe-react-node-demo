services:
  web:
    image: node:22-bookworm-slim
    init: true
    working_dir: /app
    command: sh scripts/docker-dev.sh
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PROXY_TARGET: http://127.0.0.1:3000
      EXE_DEV_HOST: ${EXE_DEV_HOST:-}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules

volumes:
  dev_node_modules:

name: Deploy to exe.dev

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: exe-react-node-demo-deploy
  cancel-in-progress: true

env:
  EXE_VM_USER: ${{ vars.EXE_VM_USER || 'exedev' }}
  EXE_APP_DIR: ${{ vars.EXE_APP_DIR || '/home/exedev/apps/exe-react-node-demo' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: exe-dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          EXE_SSH_PRIVATE_KEY: ${{ secrets.EXE_SSH_PRIVATE_KEY }}
          EXE_VM_HOST: ${{ secrets.EXE_VM_HOST }}
        run: |
          test -n "$EXE_VM_HOST" || (echo "Missing secret EXE_VM_HOST, e.g. my-vm.exe.xyz" && exit 1)
          test -n "$EXE_SSH_PRIVATE_KEY" || (echo "Missing secret EXE_SSH_PRIVATE_KEY" && exit 1)
          mkdir -p ~/.ssh
          printf '%s
' "$EXE_SSH_PRIVATE_KEY" > ~/.ssh/exe_deploy_key
          chmod 600 ~/.ssh/exe_deploy_key
          ssh-keyscan -H "$EXE_VM_HOST" >> ~/.ssh/known_hosts

      - name: Copy app to exe.dev VM
        env:
          EXE_VM_HOST: ${{ secrets.EXE_VM_HOST }}
        run: |
          ssh -i ~/.ssh/exe_deploy_key "$EXE_VM_USER@$EXE_VM_HOST" "mkdir -p '$EXE_APP_DIR'"
          rsync -az --delete             --exclude '.git' --exclude 'node_modules' --exclude 'dist'             -e "ssh -i ~/.ssh/exe_deploy_key"             ./ "$EXE_VM_USER@$EXE_VM_HOST:$EXE_APP_DIR/"

      - name: Build and restart container on exe.dev
        env:
          EXE_VM_HOST: ${{ secrets.EXE_VM_HOST }}
        run: |
          ssh -i ~/.ssh/exe_deploy_key "$EXE_VM_USER@$EXE_VM_HOST" << EOF
            set -euxo pipefail
            cd "$EXE_APP_DIR"
            docker compose up -d --build
            docker compose ps
            curl --fail --silent --show-error http://127.0.0.1:3000/health
          EOF

      - name: Deployment summary
        env:
          EXE_VM_HOST: ${{ secrets.EXE_VM_HOST }}
        run: |
          echo "### Deployed to exe.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Private/protected URL: https://$EXE_VM_HOST/" >> "$GITHUB_STEP_SUMMARY"
          echo "If needed, set the proxied port: \`ssh exe.dev share port ${EXE_VM_HOST%.exe.xyz} 3000\`" >> "$GITHUB_STEP_SUMMARY"
          echo "To make public: \`ssh exe.dev share set-public ${EXE_VM_HOST%.exe.xyz}\`" >> "$GITHUB_STEP_SUMMARY"
